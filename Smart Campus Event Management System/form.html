<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Event</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">

<h2>Add Event</h2>

<form action="/save" method="post" th:object="${event}">

<div class="mb-3">
<label>Event Name</label>
<input type="text" th:field="*{name}" class="form-control" required>
</div>

<div class="mb-3">
<label>Department</label>
<input type="text" th:field="*{department}" class="form-control" required>
</div>

<div class="mb-3">
<label>Type</label>
<input type="text" th:field="*{type}" class="form-control" required>
</div>

<div class="mb-3">
<label>Date</label>
<input type="date" th:field="*{date}" class="form-control" required>
</div>

<div class="mb-3">
</html>
