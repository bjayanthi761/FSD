<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">

<h2>Event Registration</h2>

<h4 th:text="${event.name}"></h4>

<form action="/register" method="post" th:object="${registration}">

<input type="hidden" th:field="*{event.id}">

<div class="mb-3">
<label>Student Name</label>
<input type="text" th:field="*{studentName}" class="form-control" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" th:field="*{email}" class="form-control" required>
</div>

<div class="mb-3">
<label>Department</label>
<input type="text" th:field="*{department}" class="form-control" required>
</div>

<button class="btn btn-success">Register</button>
<a href="/" class="btn btn-secondary">Back</a>
</html>
