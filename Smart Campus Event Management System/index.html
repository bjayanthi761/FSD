<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Campus Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(to right,#1e3c72,#2a5298);
    font-family:Arial;
    color:white;
}
.container-box{
    margin-top:50px;
    background:#ffffff22;
    padding:30px;
    border-radius:15px;
}
.table{
    color:white;
}
</style>
</head>
<body>

<div class="container">
<div class="container-box">

<h1 class="text-center mb-4">🎓 Campus Events</h1>

<div class="d-flex justify-content-between mb-3">

<a href="/logout" class="btn btn-danger">Logout</a>

<div th:if="${role == 'ADMIN'}">
<a href="/new" class="btn btn-info">+ Add Event</a>
</div>

</div>

<form action="/" method="get" class="mb-3 d-flex">
<input type="text" name="keyword" class="form-control me-2" placeholder="Search event">
<button class="btn btn-light">Search</button>
</form>

<table class="table table-bordered text-center">
<thead>
<tr>
<th>Name</th>
<th>Dept</th>
<th>Type</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr th:each="event : ${events}">
<td th:text="${event.name}"></td>
<td th:text="${event.department}"></td>
</html>
